# jobhunt on a VPS: Caddy terminates HTTPS and forwards only the remote
# listener, where MCP needs an OAuth login and the board a password sign-in.
# See DEPLOYMENT.md.
#   cp .env.example .env && chmod 600 .env && nano .env
#   docker compose up -d --build
# The bundled Caddy runs only with COMPOSE_PROFILES=caddy in .env. Drop that
# line when a shared proxy on the VPS forwards to 127.0.0.1:8788 instead.
#
# Docker writes its own firewall rules, so a published port is reachable even
# where ufw says it's closed. Keep every port below on 127.0.0.1.
name: jobhunt
services:
  jobhunt:
    build: ..
    image: jobhunt:local
    restart: unless-stopped
    init: true
    environment:
      JOBHUNT_DB: /data/jobhunt.db
      JOBHUNT_REMOTE_LISTEN: 0.0.0.0:8788
      JOBHUNT_PUBLIC_URL: https://${JOBHUNT_DOMAIN:?set JOBHUNT_DOMAIN in .env}
      JOBHUNT_AUTH_PASSWORD: ${JOBHUNT_AUTH_PASSWORD:?set JOBHUNT_AUTH_PASSWORD in .env}
      JOBHUNT_REMOTE_TOKEN: ${JOBHUNT_REMOTE_TOKEN:-}
      JOBHUNT_REMOTE_BOARD: ${JOBHUNT_REMOTE_BOARD:-false}
      JOBHUNT_REDIRECT_HOSTS: ${JOBHUNT_REDIRECT_HOSTS:-}
    ports:
      # MCP and the signed-in board, for a proxy running outside this stack.
      # The board on 8787 has no sign-in, so it isn't published at all: anything
      # on the server could reach it. DEPLOYMENT.md shows how to tunnel to it.
      - "127.0.0.1:8788:8788"
    # Only /data, /config and /tmp are writable, and nothing in the container
    # can gain privileges.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - data:/data
      - config:/config

  caddy:
    image: caddy:2.10-alpine
    profiles: [caddy]
    restart: unless-stopped
    depends_on: [jobhunt]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      JOBHUNT_DOMAIN: ${JOBHUNT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  config:
  caddy_data:
  caddy_config:
